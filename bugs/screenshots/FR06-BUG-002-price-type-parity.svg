<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="488">
  <rect width="100%" height="100%" fill="#181818"/>
  <text font-family="Menlo, Monaco, monospace" font-size="13"><tspan x="20" y="32" fill="#78c8ff">FR06-BUG-002 — GET /api/products/1 vs /api/products/2</tspan><tspan x="20" y="48" fill="#ffb464">Expected: price always number | Actual: odd=number, even=string</tspan><tspan x="20" y="64" fill="#e0e0e0">────────────────────────────────────────────────────────</tspan><tspan x="20" y="80" fill="#e0e0e0">Request 1: http://127.0.0.1:3000/api/products/1 -H</tspan><tspan x="20" y="96" fill="#e0e0e0"></tspan><tspan x="20" y="112" fill="#e0e0e0">{</tspan><tspan x="20" y="128" fill="#e0e0e0">  &quot;id&quot;: 1,</tspan><tspan x="20" y="144" fill="#e0e0e0">  &quot;name&quot;: &quot;iPhone 15 Pro Max&quot;,</tspan><tspan x="20" y="160" fill="#e0e0e0">  &quot;price&quot;: 30000000,</tspan><tspan x="20" y="176" fill="#e0e0e0">  &quot;description&quot;: &quot;Điện thoại cao cấp của Apple&quot;,</tspan><tspan x="20" y="192" fill="#e0e0e0">  &quot;imageUrl&quot;: &quot;https://placehold.co/300x300/png?text=iPhone+15&quot;,</tspan><tspan x="20" y="208" fill="#e0e0e0">  &quot;category_id&quot;: 1</tspan><tspan x="20" y="224" fill="#e0e0e0">}</tspan><tspan x="20" y="240" fill="#e0e0e0"></tspan><tspan x="20" y="256" fill="#e0e0e0">typeof price = int</tspan><tspan x="20" y="272" fill="#e0e0e0"></tspan><tspan x="20" y="288" fill="#e0e0e0">Request 2: http://127.0.0.1:3000/api/products/2 -H</tspan><tspan x="20" y="304" fill="#e0e0e0"></tspan><tspan x="20" y="320" fill="#e0e0e0">{</tspan><tspan x="20" y="336" fill="#e0e0e0">  &quot;id&quot;: 2,</tspan><tspan x="20" y="352" fill="#e0e0e0">  &quot;name&quot;: &quot;Samsung Galaxy S24 Ultra&quot;,</tspan><tspan x="20" y="368" fill="#e0e0e0">  &quot;price&quot;: &quot;28000000&quot;,</tspan><tspan x="20" y="384" fill="#e0e0e0">  &quot;description&quot;: &quot;Màn hình hiển thị xuất sắc, camera siêu zoom&quot;,</tspan><tspan x="20" y="400" fill="#e0e0e0">  &quot;imageUrl&quot;: &quot;https://placehold.co/300x300/png?text=Samsung+S24&quot;,</tspan><tspan x="20" y="416" fill="#e0e0e0">  &quot;category_id&quot;: 1</tspan><tspan x="20" y="432" fill="#e0e0e0">}</tspan><tspan x="20" y="448" fill="#e0e0e0"></tspan><tspan x="20" y="464" fill="#e0e0e0">typeof price = str</tspan></text>
</svg>